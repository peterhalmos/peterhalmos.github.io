<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>{{ page.title }} | Peter Halmos</title>
  <meta
    name="description"
    content="{{ page.description | default: page.excerpt | strip_html | normalize_whitespace }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/index.css' | relative_url }}"
  >
  <link
    rel="stylesheet"
    href="{{ '/assets/css/blog.css' | relative_url }}"
  >

  <!-- Configure MathJax before loading it. -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ['\\(', '\\)'],
          ['$', '$']
        ],
        displayMath: [
          ['\\[', '\\]'],
          ['$$', '$$']
        ],
        tags: 'ams',
        macros: {
          bm: ['\\boldsymbol{#1}', 1],
          RR: '\\mathbb{R}',
          EE: '\\mathbb{E}'
        }
      },
      chtml: {
        scale: 1
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
  ></script>
</head>

<body>
  <div class="page-wrapper blog-shell">

    <nav class="top-nav blog-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/blog/' | relative_url }}">Notes</a>
    </nav>

    <article class="card blog-post">
      <header class="post-header">
        <h1>{{ page.title }}</h1>

        {% if page.subtitle %}
          <p class="post-subtitle">{{ page.subtitle }}</p>
        {% endif %}

        <p class="post-meta">
          {{ page.date | date: "%B %-d, %Y" }}
          {% if page.reading_time %}
            · {{ page.reading_time }}
          {% endif %}
        </p>
      </header>

      {{ content }}
    </article>

    <footer class="site-footer">
      <p>Peter Halmos · Princeton University</p>
    </footer>

  </div>
</body>
</html>
